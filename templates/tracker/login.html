{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <title>Вход — SportApp</title>
  <link rel="stylesheet" href="{% static 'tracker/css/style.css' %}">
  <link rel="icon" href="data:,">
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-logo">🏋️</div>
    <h1 class="auth-title">SportApp</h1>
    <p class="auth-subtitle">Войди, чтобы продолжить</p>

    <div class="glass-card">
      {% if form.non_field_errors %}
        <div class="flash flash-error">{{ form.non_field_errors.0 }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="field text-left">
          <label for="{{ form.username.id_for_label }}">Логин</label>
          {{ form.username }}
        </div>
        <div class="field text-left">
          <label for="{{ form.password.id_for_label }}">Пароль</label>
          {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
      </form>
    </div>

    <p class="auth-switch">Нет аккаунта? <a href="{% url 'tracker:signup' %}">Зарегистрируйся</a></p>
  </div>
</body>
</html>
