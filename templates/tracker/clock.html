{% extends "base.html" %}
{% load static %}
{% block title %}Часы — SportApp{% endblock %}

{% block content %}
<div class="page-header">
  <p class="eyebrow">Текущее время</p>
  <h1>Часы</h1>
</div>

<div class="glass-card clock-display">
  <div class="big-time" id="clock-time">00:00:00</div>
  <div class="date" id="clock-date">—</div>
</div>

<div class="glass-card center">
  <p class="field label" style="margin-bottom:0">Секундомер</p>
  <div class="stopwatch-time" id="sw-time">00:00.00</div>
  <div class="timer-controls">
    <button class="btn btn-ghost btn-icon" id="sw-lap">Круг</button>
    <button class="btn btn-primary btn-icon" id="sw-start">▶</button>
    <button class="btn btn-ghost btn-icon" id="sw-reset">↺</button>
  </div>
  <ul class="lap-list" id="lap-list" style="margin-top:16px; text-align:left;"></ul>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'tracker/js/clock.js' %}"></script>
{% endblock %}
