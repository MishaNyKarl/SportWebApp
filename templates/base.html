{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="translucent">
  <meta name="apple-mobile-web-app-title" content="SportApp">
  <title>{% block title %}SportApp{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'tracker/css/style.css' %}">
  <link rel="icon" href="data:,">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app">
    {% if messages %}
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>

  <nav class="tabbar">
    <a class="tab-item {% if active_tab == 'timer' %}active{% endif %}" href="{% url 'tracker:timer' %}">
      <span class="tab-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2"></path><path d="M9 2h6"></path></svg>
      </span>
      <span>Таймер</span>
    </a>
    <a class="tab-item {% if active_tab == 'counter' %}active{% endif %}" href="{% url 'tracker:counter' %}">
      <span class="tab-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
      </span>
      <span>Счётчик</span>
    </a>
    <a class="tab-item {% if active_tab == 'clock' %}active{% endif %}" href="{% url 'tracker:clock' %}">
      <span class="tab-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
      </span>
      <span>Часы</span>
    </a>
    <a class="tab-item {% if active_tab == 'stats' %}active{% endif %}" href="{% url 'tracker:stats' %}">
      <span class="tab-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><rect x="7" y="12" width="3" height="6"></rect><rect x="12" y="8" width="3" height="10"></rect><rect x="17" y="5" width="3" height="13"></rect></svg>
      </span>
      <span>Статистика</span>
    </a>
    <a class="tab-item {% if active_tab == 'reminders' %}active{% endif %}" href="{% url 'tracker:reminders' %}">
      <span class="tab-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </span>
      <span>Напоминания</span>
    </a>
  </nav>

  <script src="{% static 'tracker/js/notify-check.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
